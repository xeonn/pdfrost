[package]
name = "pdfrost-engine"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
description = "JRXML subset to PDF for pdfrost"

[lib]
name = "pdfrost_engine"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
krilla = "0.8"
pdfrost-charts = { path = "../pdfrost-charts" }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.42"
thiserror = "2"

[dev-dependencies]
pdf-extract = "0.10"
